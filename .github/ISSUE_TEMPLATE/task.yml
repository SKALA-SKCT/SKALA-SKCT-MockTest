name: 작업 이슈
description: 기능, 수정, 문서, 리팩터링 작업을 시작할 때 사용합니다.
title: "[Feat] "
labels: []
assignees: []
body:
  - type: markdown
    attributes:
      value: |
        작업 전 이슈를 먼저 생성하고, 이슈 번호를 브랜치와 PR 제목에 포함해 주세요.
  - type: textarea
    id: summary
    attributes:
      label: 어떤 기능인가요?
      description: 작업 목적을 간단히 적어주세요.
      placeholder: 예) 비로그인 사용자를 랜딩 로그인 화면으로 이동시킵니다.
    validations:
      required: true
  - type: textarea
    id: tasks
    attributes:
      label: 작업 상세 내용
      description: 해야 할 일을 체크리스트로 적어주세요.
      value: |
        - [ ] 
    validations:
      required: true
  - type: dropdown
    id: type
    attributes:
      label: 작업 유형
      options:
        - FEAT
        - FIX
        - DOCS
        - REFACTOR
        - STYLE
        - CHORE
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: 작업 영역
      options:
        - FRONTEND
        - BACKEND
        - INFRA
        - DESIGN
    validations:
      required: true
  - type: textarea
    id: reference
    attributes:
      label: 참고 자료
      description: 관련 화면, 링크, 문서가 있으면 첨부해주세요.
      placeholder: 예) 스크린샷, 배포 URL, 관련 문서 링크
