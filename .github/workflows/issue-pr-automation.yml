name: Issue and PR Automation

on:
  issues:
    types: [opened, edited]
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  issues: write
  pull-requests: write
  contents: read

jobs:
  triage:
    runs-on: ubuntu-latest
    steps:
      - name: Apply labels and assignees
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const payload = context.payload;
            const item = payload.issue ?? payload.pull_request;
            const isPr = Boolean(payload.pull_request);
            const number = item.number;
            const title = item.title ?? "";
            const body = item.body ?? "";
            const author = item.user?.login;

            const ensureLabels = async (labels) => {
              for (const name of labels) {
                try {
                  await github.rest.issues.getLabel({ owner, repo, name });
                } catch (error) {
                  if (error.status !== 404) throw error;
                  await github.rest.issues.createLabel({
                    owner,
                    repo,
                    name,
                    color: labelColors[name] ?? "ededed",
                  });
                }
              }
            };

            const labelColors = {
              FEAT: "C5E86C",
              FIX: "E9485A",
              DOCS: "4D96FF",
              REFACTOR: "A371F7",
              STYLE: "F7C948",
              CHORE: "B8B8B8",
              FRONTEND: "2DD4BF",
              BACKEND: "D97706",
              INFRA: "64748B",
              DESIGN: "F472B6",
              P0: "B91C1C",
              P1: "F97316",
              P2: "FACC15",
              P3: "A3E635",
            };

            const labels = [];
            const text = `${title}\n${body}`.toLowerCase();
            const typeMap = {
              feat: "FEAT",
              fix: "FIX",
              docs: "DOCS",
              refactor: "REFACTOR",
              style: "STYLE",
              chore: "CHORE",
            };
            for (const [key, label] of Object.entries(typeMap)) {
              if (new RegExp(`\\[${key}\\]|^${key}:|/${key}/`, "i").test(title)) labels.push(label);
            }
            const areaMap = {
              frontend: "FRONTEND",
              backend: "BACKEND",
              infra: "INFRA",
              design: "DESIGN",
            };
            for (const [key, label] of Object.entries(areaMap)) {
              if (text.includes(`area: ${key}`) || text.includes(key)) labels.push(label);
            }
            for (const priority of ["P0", "P1", "P2", "P3"]) {
              if (text.includes(priority.toLowerCase())) labels.push(priority);
            }

            const uniqueLabels = [...new Set(labels)];
            if (uniqueLabels.length) {
              await ensureLabels(uniqueLabels);
              await github.rest.issues.addLabels({ owner, repo, issue_number: number, labels: uniqueLabels });
            }

            if (author) {
              try {
                await github.rest.issues.addAssignees({ owner, repo, issue_number: number, assignees: [author] });
              } catch (error) {
                core.warning(`Could not assign ${author}: ${error.message}`);
              }
            }

            if (isPr) {
              const reviewerMap = {
                pkm021118: "borimong",
                borimong: "pkm021118",
              };
              const reviewer = reviewerMap[author];
              if (reviewer) {
                try {
                  await github.rest.pulls.requestReviewers({
                    owner,
                    repo,
                    pull_number: number,
                    reviewers: [reviewer],
                  });
                } catch (error) {
                  core.warning(`Could not request reviewer ${reviewer}: ${error.message}`);
                }
              }

              if (!/(close[sd]?|fix(e[sd])?|resolve[sd]?)\s+#\d+/i.test(body)) {
                await github.rest.issues.createComment({
                  owner,
                  repo,
                  issue_number: number,
                  body: "PR 본문에 `Closes #이슈번호`를 추가해 주세요. 연결된 이슈가 있어야 작업 흐름이 추적됩니다.",
                });
              }
            }
